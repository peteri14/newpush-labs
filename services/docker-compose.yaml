services:
  traefik:
    extends:
      file: docker-compose.traefik.yaml
      service: traefik
    depends_on:
      - traefik-forward-auth
      - crowdsec
  sablier:
    extends:
      file: docker-compose.sablier.yaml
      service: sablier
  whoami:
    extends:
      file: docker-compose.traefik.yaml
      service: whoami
  casdoor:
    extends:
      file: docker-compose.casdoor.yaml
      service: casdoor
  traefik-forward-auth:
    extends:
      file: docker-compose.casdoor.yaml
      service: traefik-forward-auth
    depends_on:
      - casdoor
  mafl:
    extends:
      file: docker-compose.mafl.yaml
      service: mafl
    depends_on:
      - mafl-service-discovery
      - traefik
  mafl-service-discovery:
    extends:
      file: docker-compose.mafl.yaml
      service: mafl-service-discovery
  dozzle:
    extends:
      file: docker-compose.dozzle.yaml
      service: dozzle
    depends_on:
      - traefik
  grafana:
    extends:
      file: docker-compose.grafana.yaml
      service: grafana
    depends_on:
      - traefik
  prometheus:
    extends:
      file: docker-compose.grafana.yaml
      service: prometheus
  loki:
    extends:
      file: docker-compose.grafana.yaml
      service: loki
  promtail:
    extends:
      file: docker-compose.grafana.yaml
      service: promtail
  node-exporter:
    extends:
      file: docker-compose.grafana.yaml
      service: node-exporter
  cadvisor:
    extends:
      file: docker-compose.grafana.yaml
      service: cadvisor
  sshwifty:
    extends:
      file: docker-compose.sshwifty.yaml
      service: sshwifty
    depends_on:
      - traefik
  wetty:
    extends:
      file: docker-compose.wetty.yaml
      service: wetty
    depends_on:
      - traefik
  dockge:
    extends:
      file: docker-compose.dockge.yaml
      service: dockge
    depends_on:
      - traefik
  portainer:
    extends:
      file: docker-compose.portainer.yaml
      service: portainer
    depends_on:
      - traefik
  dockernexus:
    extends:
      file: docker-compose.dockernexus.yaml
      service: dockernexus
    depends_on:
      - traefik
  watchtower:
    extends:
      file: docker-compose.watchtower.yaml
      service: watchtower
  crowdsec:
    extends:
      file: docker-compose.crowdsec.yaml
      service: crowdsec
  lab-code-server:
    extends:
      file: docker-compose.code-server.yaml
      service: lab-code-server

networks:
  web:
    external: True
